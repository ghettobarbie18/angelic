<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angelic Template</title>

<style>

/* MAIN TEMPLATE */
.angelic-template {
    width: 700px;
    height: 600px;
    margin: auto;
    position: relative;
    overflow: hidden;
}

/* RESPONSIVE DESIGN */
@media only screen and (max-width: 1200px) {
    .angelic-template
        width: 100%;
        height: 100%;
        padding: 15px;
        box-sizing: border-box;
        background: url("https://cdna.artstation.com/p/assets/images/images/007/229/908/large/nina-vels-heavenly-crown.jpg?1504629868") center / cover no-repeat;
}

/* TEMPLATE IMAGE */
.angelic-image {
    width: 100%;
    height: 100%;
    background: url("https://raw.githubusercontent.com/ghettobarbie18/angelic/refs/heads/main/heavenly.jpg") center / cover no-repeat;
}
</style>
</head>

<body>
<div class="angelic-template">
    <div class="angelic-image"></div>
</div>
</body>
</html>
