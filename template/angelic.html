<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angelic Template</title>

<style>
/* MAIN TEMPLATE */
.angelic-template {
    width: 700px;
    height: 600px;
    margin: 40px auto;
    position: relative;
    box-sizing: border-box;
    overflow: hidden;
    padding: 20px;
}

/* MOVING IMAGE BORDER */
.angelic-template::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 20px;

    background-image: url("https://cdna.artstation.com/p/assets/images/images/007/229/908/large/nina-vels-heavenly-crown.jpg?1504629868");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;

    pointer-events: none;
    z-index: 2;
}

/* ORIGINAL TEMPLATE IMAGE */
.angelic-image {
    position: absolute;
    inset: 20px;
    background: url("https://raw.githubusercontent.com/ghettobarbie18/angelic/refs/heads/main/heavenly.jpg") center / cover no-repeat;
    z-index: 1;
}

/* RESPONSIVE DESIGN */
@media only screen and (max-width: 1200px) {
    .angelic-template {
        width: 100%;
        height: 600px;
    }
}
</style>
</head>

<body>
<div class="angelic-template">
    <div class="angelic-image"></div>
</div>
</body>
</html>
