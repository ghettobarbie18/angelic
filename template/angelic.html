<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angelic Template</title>

<style>
/* MAIN TEMPLATE */
.angelic-template {
    width: 700px;
    height: 600px;
    margin: 40px auto;
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
}

/* ARTSTATION IMAGE BORDER */
.angelic-template::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 20px;

    background: url("https://cdna.artstation.com/p/assets/images/images/007/229/908/large/nina-vels-heavenly-crown.jpg?1504629868") center / cover no-repeat fixed;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;

    pointer-events: none;
    z-index: 2;
}

/* ORIGINAL IMAGE */
.angelic-image {
    position: absolute;
    inset: 20px;
    background-color: transparent;
    background: url("https://raw.githubusercontent.com/ghettobarbie18/angelic/refs/heads/main/heavenly.jpg") center / cover no-repeat;
    z-index: 1;
    clip-path: polygon(
        30px 0,
        calc(100% - 30px) 0,
        100% 30px,
        100% calc(100% - 30px),
        calc(100% - 30px) 100%,
        30px 100%,
        0 calc(100% - 30px),
        0 30px
    );
}

/* RESPONSIVE DESIGN */
@media only screen and (max-width: 1200px) {
    .angelic-template {
        width: 100%;
        height: 600px;
    }

    .angelic-template::before {
        background-image: url("https://cdna.artstation.com/p/assets/images/images/007/229/908/large/nina-vels-heavenly-crown.jpg?1504629868");
    }
}
</style>
</head>

<body>
<div class="angelic-template">
    <div class="angelic-image"></div>
</div>
</body>
</html>
